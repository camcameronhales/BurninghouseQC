# Burninghouse QC configuration
#
# Copy to config.toml and edit. Every relative path is resolved against the
# folder this file lives in. Run with:  bhqc -c config.toml watch
#
# The thresholds below are first guesses (SPEC.md §6) — expect to adjust them
# during the pilot. `bhqc scan FILE --keep-work` leaves the sampled frames on
# disk so you can see exactly what the OCR was looking at.

[paths]
# Absolute paths are recommended for the installed service, e.g.
#   input = "/Users/Shared/BurninghouseQC/qc_root/input"
# Keep these out of ~/Desktop, ~/Documents, ~/Downloads and ~/Movies unless
# you have granted Full Disk Access — see docs/service-setup.md §5.
root        = "qc_root"
input       = "qc_root/input"
passed      = "qc_root/pass"
review      = "qc_root/review"
error       = "qc_root/error"
work        = "qc_root/work"
status_file = "qc_root/status.json"
log_file    = "qc_root/burninghouse-qc.log"


[watcher]
# A render is only picked up once its size and mtime are unchanged across
# `stability_checks` consecutive polls — 3 x 5s means ~10s of quiet. Raise both
# if renders land over a network share, where writes can stall.
poll_interval     = 5.0
stability_checks  = 3
stability_timeout = 21600          # 6h ceiling on waiting for a long render

ignore_extensions = [".tmp", ".part", ".partial", ".crdownload", ".download"]
# House delivery formats. Anything FFmpeg decodes works if you add it here.
video_extensions  = [".mov", ".mp4"]
# .DS_Store, ._AppleDouble forks, and our own scratch naming.
ignore_prefixes   = [".", "~", "_qc_"]

# macOS delivers events through FSEvents, which does NOT fire for SMB/AFP
# shares. "auto" checks the mount and switches to polling when it needs to.
use_polling      = "auto"          # "true" forces polling, "false" forces FSEvents
polling_interval = 5.0

# Hold a caffeinate assertion while a job runs so the Mac can't sleep mid-QC.
# Not held while idle, so the machine still sleeps normally between renders.
prevent_sleep = true


[black]
enabled           = true
pixel_threshold   = 0.10           # ffmpeg blackdetect pix_th
picture_threshold = 0.98           # ffmpeg blackdetect pic_th
min_duration      = 0.10           # shortest run reported at all
fail_duration     = 0.50           # >= this, mid-programme => FAIL
edge_grace        = 1.50           # black this close to head/tail counts as an edge
# Fades are on nearly every deliverable: "info" notes them in the report without
# affecting the verdict. "review" or "ignore" also available.
edge_severity     = "info"


[silence]
enabled       = true
noise_db      = -50.0
min_duration  = 1.0
fail_duration = 3.0                # >= this, mid-programme => FAIL
edge_grace    = 1.50
# Handles at head and tail are on every deliverable — "info" notes them without
# making an otherwise clean file look borderline.
edge_severity = "info"
missing_audio = "review"           # "fail" | "review" | "ignore"


[text]
enabled = true

# Sampling. Scene changes anchor denser sampling because supers arrive on cuts.
#
# At 1.5s, any card held for 3s or more is sampled at least twice — which is
# what fail_min_occurrences needs before a misspelling can FAIL rather than
# route to review. House clips run 2-10 minutes, which fits inside max_frames
# at this cadence; longer clips widen the interval rather than losing coverage
# at the end of the programme.
sample_interval         = 1.5
scene_threshold         = 0.35
scene_followup_offsets  = [0.15, 0.60, 1.20]
min_frame_gap           = 0.40
max_frames              = 600      # ceiling per job, keeps long masters bounded

# OCR
tesseract_lang = "eng"
tesseract_psm  = 11                # 11 = sparse text, best for burnt-in graphics

# Frames are rescaled to about this height before OCR: 720p is upscaled 2x,
# 1080p ~1.33x, 1440p and above are left alone. Upscaling small type helps a
# lot; upscaling an already-large frame just costs time.
ocr_target_height = 1440
ocr_min_scale     = 1.0            # 1.0 = never downscale
ocr_max_scale     = 3.0

# Confidence gates — the main false-positive control.
min_confidence         = 70.0      # below this the token is discarded as noise
fail_confidence        = 85.0      # at/above this a misspelling can be a FAIL

# Titles animate on, and a frame caught mid-wipe reads the half-revealed super
# as a word — "nson" from "Branson", "offic" from "office". Those fragments
# exist for one frame; a real super holds for seconds and is sampled several
# times. Set to 1 to see everything, at the cost of a flag on most animated
# lower thirds.
report_min_occurrences = 2         # frames a word must appear in to be reported
fail_min_occurrences   = 2         # ...and to be a FAIL rather than a review
min_word_length      = 4           # shorter tokens are too noisy to trust


[spelling]
language                 = "en"
custom_dictionary        = "dictionary/custom_words.txt"
ignore_all_caps_acronyms = true
# colour/organise/centre are accepted automatically; see burninghouse_qc/variants.py
accept_british_spellings = true

# Only check tokens capitalised like real words: lowercase, Title Case, ALL CAPS.
# "gOLOUR" is a misread C, not a misspelling — people don't change case halfway
# through a word. A significant false-positive control on stylised graphics.
# Mixed-case brand names (ProRes, iPhone) go in the custom dictionary.
require_normal_case = true

# Skip Title-case words sitting beside another Title-case word — almost always
# a name in a lower third. A spell-checker cannot validate a surname, and no
# dictionary will hold every name a client sends.
skip_proper_nouns = true


[routing]
# Where the report goes and what happens to the render.
#
#   "alongside"   — write the report next to the render, named <file>.qc.html.
#                   Nothing is moved and no sorting folders are used; the
#                   verdict is inside the report. Needs a writable folder.
#   "report_only" — never write beside the render; file the report in
#                   pass/review/error instead. Use this when the watched folder
#                   must stay untouched (see docs/server-safety.md).
#   "copy"        — leave the original; put a verified copy in the verdict folder.
#   "move"        — relocate the render. QC folders this app owns ONLY.
mode = "alongside"

# For the verdict-folder modes only: drop a symlink beside the report pointing
# at the original. Pointless in "alongside", where they already sit together.
symlink_in_verdict_folder = false

# Checksum a copy against its source before trusting it. Doubles the read cost
# of a copy; worth turning on if you ever set mode = "move".
verify_hash = false

# QC reads the file several times over. When the input folder is on a network
# mount, copy it to local scratch once and analyse that instead — one read
# instead of three, and no long-lived file handle on the server.
work_from_local_copy = true
max_local_copy_gb    = 25.0        # larger than this, read in place


[report]
thumbnail_width = 480
max_thumbnails  = 60

# A machine-readable sidecar alongside the HTML. Off by default — it is clutter
# next to a render unless something is actually consuming it.
write_json = false

# Put the verdict in the report filename ("Spot [FAIL].qc.html") so a folder
# listing can be triaged without opening anything.
verdict_in_filename = false
